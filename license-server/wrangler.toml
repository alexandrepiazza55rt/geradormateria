name = "gerador-licenca"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Banco de licenças (D1/SQLite). O database_id é preenchido após `wrangler d1 create licencas`.
[[d1_databases]]
binding = "DB"
database_name = "licencas"
database_id = "6d3fadcf-7575-43d0-a7df-937220308889"
migrations_dir = "migrations"

# Secrets (NÃO ficam aqui — definidos via `wrangler secret put`):
#   LICENSE_SIGNING_KEY   → chave PRIVADA Ed25519 (hex). NUNCA commitar.
#   ADMIN_TOKEN           → token para as rotas /v1/admin/*.
# Variáveis públicas:
[vars]
LICENSE_PUBLIC_KEY = "PREENCHER_COM_A_PUBLICA_HEX"   # informativa; a pública também vai embutida no cliente
PRODUTO = "gerador-materiais"
DIAS_CARENCIA = "15"
